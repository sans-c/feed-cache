name: Cache RSS feed

on:
  workflow_dispatch:
  schedule:
  -cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download feed
        run: |
          mkdir -p feeds
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --output feeds/grewi.xml.new \
            https://www.grewi.de/feed/

          test -s feeds/grewi.xml.new
          mv feeds/grewi.xml.new feeds/grewi.xml

      - name: Commit changed feed
        run: |
          if git diff --quiet -- feeds/grewi.xml; then
            echo "Feed has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feeds/grewi.xml
          git commit -m "Update GreWi feed"
          git push
